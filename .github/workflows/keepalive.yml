# Gói miễn phí của Supabase tự tạm dừng nếu 7 ngày không có hoạt động.
# Cứ 3 ngày gọi nhẹ REST một lần để dự án luôn "đang dùng".
# Cần 2 secret trong repo: SUPABASE_URL, SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi REST nhẹ
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Chưa đặt secret SUPABASE_URL / SUPABASE_ANON_KEY, bỏ qua."; exit 0
          fi
          # đọc 1 dòng của bảng khoá (RLS trả mảng rỗng khi chưa đăng nhập, vẫn tính là có truy vấn tới cơ sở dữ liệu)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/to_chuyen_mon?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
